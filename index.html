<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匿名私信</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#121212;color:#eee;max-width:600px;margin:2rem auto;padding:0 1rem}
h2{text-align:center;margin-bottom:1.5rem;color:#ccc}
#chatBox{border:1px solid #333;border-radius:10px;padding:1rem;height:400px;overflow-y:auto;margin-bottom:1rem;background:#181818}
.msg{margin:0.6rem 0;line-height:1.5}
.msg-self{text-align:right;color:#8cf}
.msg-other{text-align:left;color:#fff}
#msgInput{width:calc(100% - 80px);padding:0.7rem;border-radius:8px;border:none;background:#222;color:#eee;font-size:1rem}
#sendBtn{width:72px;padding:0.7rem;border:none;border-radius:8px;background:#369;color:#fff;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<h2>匿名私聊</h2>
<div id="chatBox"></div>
<div>
<input id="msgInput" placeholder="輸入訊息...">
<button id="sendBtn">送出</button>
</div>

<script>
// 這裡替換成你的 Supabase URL 跟 anon key
const SUPABASE_URL = "你的SUPABASE_URL";
const SUPABASE_KEY = "你的ANON_KEY";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ========== 通知 + 提示音功能 ==========
let notifyAudio = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3");
let roomId = new URLSearchParams(location.search).get("room") || crypto.randomUUID();

async function requestNotify() {
  if (!("Notification" in window)) return false;
  const perm = await Notification.requestPermission();
  return perm === "granted";
}
function showNotify(title, body) {
  if (Notification.permission === "granted") {
    new Notification(title, { body });
  }
  notifyAudio.play().catch(e=>{});
}
requestNotify();

// ========== 載入訊息、監聽即時更新 ==========
const chatBox = document.getElementById("chatBox");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");

async function loadMessages() {
  const { data } = await supabase
    .from("messages")
    .select("*")
    .eq("room_id", roomId)
    .order("created_at", { ascending: true });
  renderMsg(data);
}
function renderMsg(list) {
  chatBox.innerHTML = "";
  list.forEach(item=>{
    const div = document.createElement("div");
    div.className = item.is_self ? "msg msg-self" : "msg msg-other";
    div.innerText = item.content;
    chatBox.appendChild(div);
  })
  chatBox.scrollTop = chatBox.scrollHeight;
}

// Realtime 監聽
const channel = supabase
.channel(`room-${roomId}`)
.on("postgres_changes", {
  event: "INSERT",
  schema: "public",
  table: "messages",
  filter: `room_id=eq.${roomId}`
}, (payload)=>{
  loadMessages();
  // 只有當前房間新訊息才通知
  showNotify("新訊息", "對方傳來訊息了");
})
.subscribe();

// 送出訊息
sendBtn.onclick = async ()=>{
  const content = msgInput.value.trim();
  if(!content) return;
  await supabase.from("messages").insert([{
    room_id: roomId,
    content: content,
    is_self:true
  }])
  msgInput.value = "";
}
loadMessages();
</script>
</body>
</html>
