<html lang="zh-TW">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'PingFang TC','Microsoft JhengHei',system-ui,-apple-system,sans-serif}
body{
  background:linear-gradient(160deg,#fff7f3 0%,#ffeef2 55%,#fff3ea 100%);
  color:#5c4a4a;max-width:600px;margin:2rem auto;padding:0 1rem;min-height:100vh}
h2{text-align:center;margin-bottom:1.2rem;color:#e8839b;font-weight:700;letter-spacing:0.05em}
h2::before{content:"🎀 "}
h2::after{content:" 🎀"}
.tab{display:flex;gap:0.5rem;margin-bottom:1rem;background:#fff;border:1px solid #f6dde2;border-radius:18px;padding:0.35rem}
.tab button{flex:1;padding:0.6rem;background:transparent;border:none;color:#a88b8f;border-radius:13px;cursor:pointer;font-size:0.9rem;font-weight:600;transition:all .2s}
.tab button.active{background:linear-gradient(135deg,#ffb6c1,#ffc9a9);color:#fff;box-shadow:0 4px 10px rgba(255,170,180,.35)}
#chatBox{border:1px solid #f6dde2;border-radius:22px;padding:1rem;height:420px;overflow-y:auto;margin-bottom:1rem;background:rgba(255,255,255,.72);box-shadow:0 6px 18px rgba(232,131,155,.10)}
.msg{margin:0.7rem 0;padding:0.75rem 0.9rem;border-radius:18px;max-width:80%;position:relative;line-height:1.5;box-shadow:0 3px 8px rgba(180,120,130,.10)}
.other{background:#fff;border:1px solid #fbe4e8;margin-right:auto;border-bottom-left-radius:6px}

.me .msg-nick{color:#7a3b48}
.me .time{color:#8a5a63}

.msg audio{max-width:100%;margin:0.4rem 0;display:block}

.other .msg-nick{text-align:left}
.msg-nick::before{content:"●";font-size:0.6rem;color:#ffb6c1}
.reply-quote{font-size:0.75rem;color:#a88b8f;border-left:2px solid #ffd3db;padding:0.3rem 0.5rem;margin-bottom:0.3rem;opacity:0.9;text-align:left;border-radius:0 8px 8px 0;background:#fff4f6}
.time{font-size:0.68rem;color:#b9a3a6;margin-top:5px}
.reply-btn{font-size:0.7rem;background:none;border:none;color:#c9a7ad;cursor:pointer;padding:0 0.3rem;margin-top:2px;box-shadow:none}
.reply-btn:hover{color:#e8839b}
.reply-status{font-size:0.8rem;color:#e8839b;margin-bottom:0.5rem;display:none;background:#fff4f6;border:1px dashed #ffd3db;border-radius:12px;padding:0.5rem 0.7rem}
.reply-status span{cursor:pointer;color:#c9a7ad;margin-left:0.5rem}

/* 表情反應 */
.msg-reactions{display:flex;gap:0.3rem;margin-top:0.4rem;flex-wrap:wrap;justify-content:flex-end}
.other .msg-reactions{justify-content:flex-start}
.reaction-item{background:#fff;border:1px solid #fbe4e8;border-radius:12px;padding:0.15rem 0.55rem;font-size:0.85rem;cursor:pointer;transition:all .15s}
.reaction-item:hover{background:#fff0f2;transform:translateY(-1px)}
.msg-reaction-bar{
  position:absolute;bottom:-14px;left:8px;
  display:none;gap:0.2rem;background:#fff;
  border:1px solid #fbe4e8;border-radius:20px;padding:0.25rem 0.5rem;z-index:10;
  box-shadow:0 4px 10px rgba(180,120,130,.15)}
.msg:hover .msg-reaction-bar{display:flex}
.me .msg-reaction-bar{left:auto;right:8px}
.msg-reaction-bar span{cursor:pointer;font-size:0.9rem;padding:0 0.2rem}
.msg-reaction-bar span:hover{transform:scale(1.2)}

/* 圖片預覽 */
.image-preview{display:none;margin-bottom:0.5rem;position:relative}
.image-preview img{max-width:120px;border-radius:12px;border:1px solid #fbe4e8}
.image-preview span{position:absolute;top:-6px;right:-6px;background:#ffb6c1;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.8rem;box-shadow:0 2px 6px rgba(232,131,155,.4)}

/* 語音預覽 */
.audio-preview{display:none;margin-bottom:0.5rem;position:relative;align-items:center;gap:0.6rem;flex-wrap:wrap;width:fit-content;background:#fff4f6;border:1px dashed #ffd3db;border-radius:14px;padding:0.5rem 0.7rem}
.audio-preview audio{max-width:220px;flex-shrink:0;height:36px}
.audio-preview .discard{background:#ff8fa3;border:none;color:#fff;border-radius:20px;padding:0.35rem 0.85rem;font-size:0.75rem;cursor:pointer;flex-shrink:0;position:relative;z-index:2;pointer-events:auto;min-height:30px}
.audio-preview .discard:hover{background:#ff758f}
.rec-timer{font-size:0.85rem;color:#ff758f;font-weight:700;min-width:46px;text-align:center;font-variant-numeric:tabular-nums}

#inputArea{display:flex;gap:0.5rem;align-items:flex-end}
.input-tools{display:flex;gap:0.3rem;flex-direction:column}
.input-tools button{padding:0;background:#fff;border:1px solid #fbe4e8;color:#e8839b;border-radius:50%;cursor:pointer;font-size:1.1rem;width:42px;height:42px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.input-tools button:hover{background:#fff0f2}
.input-tools button.recording{background:#ff8fa3;border-color:#ff8fa3;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.emoji-panel{display:none;gap:0.4rem;padding:0.6rem;background:#fff;border:1px solid #fbe4e8;border-radius:16px;margin-bottom:0.5rem;flex-wrap:wrap;box-shadow:0 4px 12px rgba(180,120,130,.10)}
.emoji-panel span{font-size:1.3rem;cursor:pointer;padding:0.2rem 0.4rem;border-radius:8px}
.emoji-panel span:hover{background:#fff0f2;transform:scale(1.15)}
textarea{flex:1;padding:0.85rem;background:#fff;border:1px solid #fbe4e8;border-radius:16px;color:#5c4a4a;resize:none;font-family:inherit}
textarea:focus{outline:none;border-color:#ffb6c1;box-shadow:0 0 0 3px rgba(255,182,193,.2)}
button{padding:0 1.3rem;background:linear-gradient(135deg,#ffb6c1,#ffc9a9);color:#fff;border:none;border-radius:16px;cursor:pointer;font-weight:600;box-shadow:0 4px 10px rgba(255,170,180,.3);transition:all .15s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(255,170,180,.4)}
</style>
</head>

</div>

<script>
const SUPABASE_URL = "https://lwbqcmvwqtlcgsccezxb.supabase.co";
const SUPABASE_KEY = "sb_publishable_jW632EqSBRq4hBCM4xdP4A_1ftKbvMM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const GLOBAL_ROOM = "global";
const ADMIN_PREFIX = "dm_admin_";
const ADMIN_DISPLAY_NAME = "口哈內";
const QUICK_EMOJIS = ["👍","❤️","😂","😮","😭"];

// ========== 時間格式化：指定台北時區，月-日 時:分 ==========
function formatTime(isoString){
  if(!isoString) return "";
  const date = new Date(isoString);
  if(isNaN(date.getTime())) return String(isoString);
  const fmt = new Intl.DateTimeFormat("zh-TW", {
    timeZone: "Asia/Taipei",
    month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit",
    hour12: false
  });
  const parts = fmt.formatToParts(date);
  const get = t => (parts.find(p => p.type === t) || {}).value || "";
  let hh = get("hour");
  if(hh === "24") hh = "00";
  return `${get("month")}-${get("day")} ${hh}:${get("minute")}`;
}

// 通知 + 提示音
const notifyAudio = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3");
async function requestNotify() {
  if (!("Notification" in window)) return false;
  const perm = await Notification.requestPermission();
  return perm === "granted";
}
function showNotify(title, body) {
  if (document.hidden && Notification.permission === "granted") {
    new Notification(title, { body });
  }
  notifyAudio.play().catch(()=>{});
}
requestNotify();

// 回覆狀態
let currentReplyId = null;
let currentImage = null;

// 語音錄音狀態
let recorder = null;
let audioChunks = [];
let currentAudio = null;
let micStream = null;
let recTimerId = null;
let recSeconds = 0;
let audioDiscarded = false; // 點捨棄後，onstop 不再把音檔塞回預覽
const MAX_REC_SECONDS = 60; // 最長錄音 60 秒，到點自動停止

function fmtSec(s){
  const m = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return `${m}:${ss}`;
}
function updateRecTimer(){
  const el = document.getElementById("recTimer");
  el.textContent = fmtSec(recSeconds);
}

// 訪客ID + 自動分配固定編號
function getVisitorId(){
  let vid = localStorage.getItem("visitor_id");
  if(!vid){
    vid = crypto.randomUUID();
    localStorage.setItem("visitor_id", vid);
  }
  return vid;
}
function getNickname(){
  const vid = getVisitorId();
  let hash = 0;
  for(let i=0; i<vid.length; i++){
    hash = ((hash << 5) - hash) + vid.charCodeAt(i);
    hash |= 0;
  }
  const num = Math.abs(hash) % 900 + 100;
  return `訪客 #${num}`;
}
const visitorId = getVisitorId();
const privateRoomId = ADMIN_PREFIX + visitorId;

let roomId;
let channel = null;

// 讀取本機表情紀錄
function getReactionRecord(){
  try {
    return JSON.parse(localStorage.getItem("reaction_record") || "{}");
  } catch(e){
    return {};
  }
}
function setReactionRecord(record){
  localStorage.setItem("reaction_record", JSON.stringify(record));
}

function switchRoom(newRoom){
  roomId = newRoom;
  cancelReply();
  clearImage();
  clearAudio();
  document.getElementById("btnGlobal").classList.toggle("active", roomId === GLOBAL_ROOM);
  document.getElementById("btnPrivate").classList.toggle("active", roomId === privateRoomId);
  loadMsg();
  subscribeRealtime();
}

document.getElementById("btnGlobal").onclick = ()=>switchRoom(GLOBAL_ROOM);
document.getElementById("btnPrivate").onclick = ()=>switchRoom(privateRoomId);

const urlParams = new URLSearchParams(location.search);
const urlRoom = urlParams.get("room");
if(urlRoom){
  roomId = urlRoom;
  document.getElementById("btnGlobal").classList.toggle("active", roomId === GLOBAL_ROOM);
  document.getElementById("btnPrivate").classList.toggle("active", roomId === privateRoomId);
}else{
  switchRoom(privateRoomId);
}

// 表情面板
function toggleEmoji(){
  const panel = document.getElementById("emojiPanel");
  panel.style.display = panel.style.display === "flex" ? "none" : "flex";
}
document.querySelectorAll("#emojiPanel span").forEach(el=>{
  el.onclick = ()=>{
    document.getElementById("msgInput").value += el.innerText;
    document.getElementById("msgInput").focus();
  }
})

// 圖片上傳 + 自動壓縮
document.getElementById("imageInput").onchange = async function(e){
  const file = e.target.files[0];
  if(!file) return;

  const img = new Image();
  img.src = URL.createObjectURL(file);
  await new Promise(r=>img.onload = r);

  const maxWidth = 800;
  let w = img.width, h = img.height;
  if(w > maxWidth){
    h = h * maxWidth / w;
    w = maxWidth;
  }

  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);

  currentImage = canvas.toDataURL("image/jpeg", 0.8);
  document.getElementById("previewImg").src = currentImage;
  document.getElementById("imagePreview").style.display = "block";
  e.target.value = "";
}

function clearImage(){
  currentImage = null;
  document.getElementById("imagePreview").style.display = "none";
  document.getElementById("previewImg").src = "";
}

// ========== 語音錄音 ==========
function startRecTimer(){
  recSeconds = 0;
  updateRecTimer();
  document.getElementById("recTimer").style.display = "inline-block";
  recTimerId = setInterval(()=>{
    recSeconds++;
    updateRecTimer();
    if(recSeconds >= MAX_REC_SECONDS) toggleRecord(); // 到最長秒數自動停止
  }, 1000);
}
function stopRecTimer(){
  if(recTimerId){ clearInterval(recTimerId); recTimerId = null; }
  document.getElementById("recTimer").style.display = "none";
}

async function toggleRecord(){
  // 正在錄音 → 停止
  if(recorder){
    recorder.stop();
    return;
  }
  try{
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
      ? "audio/webm;codecs=opus"
      : (MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "");
    recorder = mime ? new MediaRecorder(micStream, { type: mime }) : new MediaRecorder(micStream);
    audioChunks = [];

    recorder.ondataavailable = e => { if(e.data && e.data.size) audioChunks.push(e.data); };

    recorder.onstop = () => {
      stopRecTimer();
      const mime = recorder ? recorder.mimeType : "";
      if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
      recorder = null;
      const btn = document.getElementById("recBtn");
      btn.innerText = "🎤";
      btn.classList.remove("recording");

      // 若已按捨棄，不保留、不顯示這段音檔
      if(audioDiscarded) return;

      const blob = new Blob(audioChunks, { type: mime || "audio/webm" });
      const reader = new FileReader();
      reader.onloadend = () => {
        currentAudio = reader.result;
        const player = document.getElementById("audioEl");
        player.src = currentAudio;
        player.onloadedmetadata = () => {
          const dur = Math.round(player.duration || recSeconds);
          document.getElementById("audioDuration").textContent = fmtSec(dur);
        };
        document.getElementById("audioPreview").style.display = "flex";
      };
      reader.readAsDataURL(blob);
    };

    audioDiscarded = false;
    recorder.start();
    startRecTimer();
    const btn = document.getElementById("recBtn");
    btn.innerText = "⏹";
    btn.classList.add("recording");
  }catch(err){
    alert("無法取得麥克風權限，請允許麥克風權限後再試");
    console.error(err);
    if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
    recorder = null;
    stopRecTimer();
  }
}

function clearAudio(){
  // 標記為捨棄：即使 onstop 稍後才觸發，也不會把音檔塞回預覽
  audioDiscarded = true;
  // 若還在錄音，一併停止
  if(recorder){ try{ recorder.stop(); }catch(e){} }
  stopRecTimer();
  currentAudio = null;
  const player = document.getElementById("audioEl");
  try{ player.pause(); }catch(e){}
  player.removeAttribute("src");
  player.load();
  document.getElementById("audioPreview").style.display = "none";
  document.getElementById("audioDuration").textContent = "";
  const btn = document.getElementById("recBtn");
  btn.innerText = "🎤";
  btn.classList.remove("recording");
}

// 回覆功能
function setReply(msgId, content){
  currentReplyId = msgId;
  document.getElementById("replyText").innerText =
    content.length > 20 ? content.slice(0,20)+"..." : content;
  document.getElementById("replyStatus").style.display = "block";
  document.getElementById("msgInput").focus();
}
function cancelReply(){
  currentReplyId = null;
  document.getElementById("replyStatus").style.display = "none";
}

// 表情反應：樂觀更新，不跳滾動
window.addReaction = async function(msgId, emoji){
  const record = getReactionRecord();
  const key = `${msgId}_${emoji}`;
  const hasReacted = !!record[key];

  updateReactionDom(msgId, emoji, hasReacted ? -1 : 1);

  if(hasReacted){ delete record[key]; } else { record[key] = true; }
  setReactionRecord(record);

  try {
    const {data: row, error: selectErr} = await sb
      .from("messages")
      .select("reactions")
      .eq("id", msgId)
      .single();
    if(selectErr) throw selectErr;

    const current = row.reactions && typeof row.reactions === 'object' ? row.reactions : {};
    current[emoji] = (current[emoji] || 0) + (hasReacted ? -1 : 1);
    if(current[emoji] <= 0) delete current[emoji];

    const {error: updateErr} = await sb
      .from("messages")
      .update({ reactions: current })
      .eq("id", msgId);
    if(updateErr) throw updateErr;

  } catch(e) {
    console.error("表情同步失敗：", e);
    updateReactionDom(msgId, emoji, hasReacted ? 1 : -1);
    if(hasReacted){ record[key] = true; } else { delete record[key]; }
    setReactionRecord(record);
  }
}

// 局部更新單則訊息的表情
function updateReactionDom(msgId, emoji, delta){
  const msgEl = document.querySelector(`.msg[data-id="${msgId}"]`);
  if(!msgEl) return;

  let reactionsBox = msgEl.querySelector(".msg-reactions");
  let target = reactionsBox ? reactionsBox.querySelector(`[data-emoji="${emoji}"]`) : null;
  let count = target ? parseInt(target.dataset.count) : 0;
  count += delta;

  if(count <= 0){
    if(target) target.remove();
  } else {
    if(target){
      target.dataset.count = count;
      target.childNodes[0].textContent = `${emoji} ${count}`;
    } else {
      if(!reactionsBox){
        reactionsBox = document.createElement("div");
        reactionsBox.className = "msg-reactions";
        const timeEl = msgEl.querySelector(".time");
        timeEl.parentNode.insertBefore(reactionsBox, timeEl);
      }
      const span = document.createElement("span");
      span.className = "reaction-item";
      span.dataset.emoji = emoji;
      span.dataset.count = count;
      span.innerText = `${emoji} ${count}`;
      span.onclick = ()=>addReaction(msgId, emoji);
      reactionsBox.appendChild(span);
    }
  }

  if(reactionsBox && reactionsBox.children.length === 0){
    reactionsBox.remove();
  }
}

function renderChat(rows){
  const box = document.getElementById("chatBox");
  box.innerHTML = "";
  rows.forEach(r=>{
    const div = document.createElement("div");

    let isMe = false;
    if(r.sender_id && r.sender_id.trim() !== ""){
      isMe = r.sender_id === visitorId;
    }
    div.className = "msg " + (isMe ? "me" : "other");
    div.dataset.id = r.id;

    const isAdmin = r.is_admin || r.sender_id === "admin";
    const nick = isAdmin ? ADMIN_DISPLAY_NAME : (r.nickname || "匿名使用者");
    div.innerHTML += `<div class="msg-nick">${nick}</div>`;

    if(r.reply_to){
      const target = rows.find(x=>x.id === r.reply_to);
      const quoteText = target ? target.content : "已刪除的訊息";
      const short = quoteText.length > 20 ? quoteText.slice(0,20)+"..." : quoteText;
      div.innerHTML += `<div class="reply-quote">↩ ${short}</div>`;
    }

    if(r.image){
      div.innerHTML += `<img src="${r.image}" alt="圖片">`;
    }

    if(r.audio){
      div.innerHTML += `<audio controls preload="metadata"><source src="${r.audio}" type="audio/webm"></audio>`;
    }

    if(r.content){
      div.innerHTML += `<div>${r.content}</div>`;
    }

    if(r.reactions && Object.keys(r.reactions).length > 0){
      let reactionHtml = '<div class="msg-reactions">';
      Object.entries(r.reactions).forEach(([emoji, count])=>{
        reactionHtml += `<span class="reaction-item" data-emoji="${emoji}" data-count="${count}" onclick="addReaction(${r.id}, '${emoji}')">${emoji} ${count}</span>`;
      })
      reactionHtml += '</div>';
      div.innerHTML += reactionHtml;
    }

    let barHtml = '<div class="msg-reaction-bar">';
    QUICK_EMOJIS.forEach(e=>{
      barHtml += `<span onclick="addReaction(${r.id}, '${e}')">${e}</span>`;
    })
    barHtml += '</div>';
    div.innerHTML += barHtml;

    const replyText = r.content ? r.content.replace(/'/g,"\\'") : "圖片/語音";
    div.innerHTML += `<button class="reply-btn" onclick="setReply(${r.id}, '${replyText}')">回覆</button>`;

    div.innerHTML += `<div class="time">${formatTime(r.created_at)}</div>`;
    box.appendChild(div);
  })
  box.scrollTop = box.scrollHeight;
}

async function loadMsg(){
  const {data,error} = await sb
    .from("messages")
    .select("*")
    .eq("room_id", roomId)
    .order("created_at",{ascending:true})
  if(!error) renderChat(data);
}

async function sendMsg(){
  const text = document.getElementById("msgInput").value.trim();
  if(!text && !currentImage && !currentAudio) return;

  const payload = {
    room_id: roomId,
    content: text,
    is_admin: false,
    sender_id: visitorId,
    nickname: getNickname(),
    // 前端直接產生時間（正確 UTC 時間戳），不依賴資料庫 now()
    created_at: new Date().toISOString()
  };
  if(currentReplyId) payload.reply_to = currentReplyId;
  if(currentImage) payload.image = currentImage;
  if(currentAudio) payload.audio = currentAudio;

  const {error} = await sb.from("messages").insert([payload]);
  if(error) console.log("送出錯誤：", error);

  document.getElementById("msgInput").value = "";
  cancelReply();
  clearImage();
  clearAudio();
}

function subscribeRealtime(){
  if(channel) channel.unsubscribe();
  channel = sb.channel(`room-${roomId}`)
    .on("postgres_changes",{event:"*",schema:"public",table:"messages",filter:`room_id=eq.${roomId}`},(payload)=>{
      if(payload.eventType === "INSERT"){
        loadMsg();
        showNotify("新訊息", "你有一則新的匿名訊息");
      } else if(payload.eventType === "UPDATE"){
        const newRow = payload.new;
        updateReactionDomFull(newRow.id, newRow.reactions);
      }
    })
    .subscribe()
}

function updateReactionDomFull(msgId, reactions){
  const msgEl = document.querySelector(`.msg[data-id="${msgId}"]`);
  if(!msgEl) return;

  let reactionsBox = msgEl.querySelector(".msg-reactions");
  if(!reactionsBox){
    reactionsBox = document.createElement("div");
    reactionsBox.className = "msg-reactions";
    const timeEl = msgEl.querySelector(".time");
    timeEl.parentNode.insertBefore(reactionsBox, timeEl);
  }

  reactionsBox.innerHTML = "";
  if(reactions && Object.keys(reactions).length > 0){
    Object.entries(reactions).forEach(([emoji, count])=>{
      const span = document.createElement("span");
      span.className = "reaction-item";
      span.dataset.emoji = emoji;
      span.dataset.count = count;
      span.innerText = `${emoji} ${count}`;
      span.onclick = ()=>addReaction(msgId, emoji);
      reactionsBox.appendChild(span);
    })
  } else {
    reactionsBox.remove();
  }
}

loadMsg();
subscribeRealtime();
</script>
</body>
</html>
