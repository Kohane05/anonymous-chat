<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匿名私信</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#121212;color:#eee;max-width:600px;margin:2rem auto;padding:0 1rem}
h2{text-align:center;margin-bottom:1rem;color:#ccc}
.tab{display:flex;gap:0.5rem;margin-bottom:1rem}
.tab button{flex:1;padding:0.6rem;background:#222;border:1px solid #444;color:#ddd;border-radius:8px;cursor:pointer}
.tab button.active{background:#333;border-color:#555}
.chat-box{height:60vh;overflow-y:auto;border:1px solid #333;border-radius:8px;padding:0.8rem;background:#181818;margin-bottom:1rem}
.msg-wrap{margin:0.4rem 0;display:flex}
.msg-left{justify-content:flex-start}
.msg-right{justify-content:flex-end}
.msg{max-width:75%;padding:0.6rem;border-radius:10px;position:relative}
.msg-left .msg{background:#272727}
.msg-right .msg{background:#204066}
.msg-nick{font-size:0.75rem;color:#aaa;margin-bottom:0.2rem}
.msg-time{font-size:0.7rem;color:#999;margin-top:0.2rem;text-align:right}
.msg-content{word-break:break-all}
.msg-img{max-width:100%;border-radius:6px;margin-top:0.3rem}
.audio-wrap{margin-top:0.3rem;display:flex;align-items:center;gap:0.4rem}
audio{height:32px}
.del-audio-btn{padding:0.2rem 0.4rem;background:#444;border:none;color:#fff;border-radius:4px;font-size:0.75rem;cursor:pointer}
.reaction-bar{display:flex;gap:0.3rem;margin-top:0.3rem}
.reaction-btn{background:#222;border:1px solid #444;color:#ddd;padding:0.2rem 0.4rem;border-radius:6px;font-size:0.85rem;cursor:pointer}
.reaction-btn.active{background:#365888;border-color:#4878b8}
.input-area{display:flex;gap:0.4rem;flex-wrap:wrap}
#msgInput{flex:1;min-width:120px;padding:0.6rem;background:#222;border:1px solid #444;color:#eee;border-radius:8px}
.send-btn, .rec-btn, .img-btn{padding:0.6rem;background:#222;border:1px solid #444;color:#ddd;border-radius:8px;cursor:pointer}
.rec-btn.recording{background:#772222;border-color:#aa3333}
.rec-timer{color:#ff8888;font-size:0.85rem;margin-left:0.4rem}
#fileInput{display:none}
.announce-item{border:1px solid #333;border-radius:8px;padding:0.8rem;margin-bottom:0.8rem;background:#191919}
.announce-content{margin-bottom:0.5rem}
.announce-reply{margin-top:0.6rem;padding:0.4rem;background:#222;border-radius:6px;font-size:0.9rem}
.announce-input{width:100%;padding:0.5rem;background:#222;border:1px solid #444;color:#eee;border-radius:6px;margin-top:0.4rem}
</style>
</head>
<body>
<h2>匿名私信</h2>
<div class="tab">
<button class="active" data-tab="chat">聊天</button>
<button data-tab="announce">公告討論</button>
</div>

<div id="chatPage">
<div class="chat-box" id="chatBox"></div>
<div class="input-area">
<input type="text" id="msgInput" placeholder="輸入訊息">
<button class="send-btn" onclick="sendMessage()">送出</button>
<button class="rec-btn" id="recBtn" onclick="toggleRec()">🎤錄音<span id="recTimer" class="rec-timer"></span></button>
<button class="img-btn" onclick="document.getElementById('fileInput').click()">📷圖片</button>
<input type="file" id="fileInput" accept="image/*" onchange="sendImage(event)">
</div>
</div>

<div id="announcePage" style="display:none">
<div id="announceList"></div>
</div>

<script>
const SUPABASE_URL = "你的supabase url";
const SUPABASE_KEY = "你的anon key";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let roomId = "global";
let senderId = localStorage.getItem("senderId");
if(!senderId){
    senderId = Math.random().toString(36).slice(2,10);
    localStorage.setItem("senderId", senderId);
}
let nickname = localStorage.getItem("nickname");
if(!nickname){
    nickname = "訪客"+Math.floor(Math.random()*9999);
    localStorage.setItem("nickname", nickname);
}

// 時區函數 +8 台北時間
function formatTime(ts){
    const d = new Date(ts);
    const t = new Date(d.getTime() + 8*60*60*1000);
    const m = String(t.getMonth()+1).padStart(2,'0');
    const day = String(t.getDate()).padStart(2,'0');
    const h = String(t.getHours()).padStart(2,'0');
    const mi = String(t.getMinutes()).padStart(2,'0');
    return `${m}-${day} ${h}:${mi}`;
}

// 切換頁籤
document.querySelectorAll(".tab button").forEach(b=>{
    b.onclick = ()=>{
        document.querySelectorAll(".tab button").forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
        const t = b.dataset.tab;
        document.getElementById("chatPage").style.display = t==="chat" ? "block":"none";
        document.getElementById("announcePage").style.display = t==="announce" ? "block":"none";
        if(t==="announce") loadAnnounce();
    }
})

// 聊天即時監聽
async function loadMsg(){
    const {data} = await supabase.from("messages").select("*").eq("room_id",roomId).order("created_at",{asc:true});
    renderMsg(data);
}
function renderMsg(list){
    const box = document.getElementById("chatBox");
    box.innerHTML = "";
    list.forEach(m=>{
        const isMe = m.sender_id === senderId;
        const wrap = document.createElement("div");
        wrap.className = "msg-wrap "+(isMe?"msg-right":"msg-left");
        let html = `<div class="msg">
        <div class="msg-nick">${m.nickname}</div>
        <div class="msg-content">`;
        if(m.type==="img"){
            html += `<img class="msg-img" src="${m.content}">`;
        }else if(m.type==="audio"){
            html += `<div class="audio-wrap"><audio controls src="${m.content}"></div>`;
        }else{
            html += m.content;
        }
        html += `</div>
        <div class="msg-time">${formatTime(m.created_at)}</div>
        <div class="reaction-bar">
        ${["👍","❤️","😂","😯","😢","😡"].map(em=>{
            const has = m.reaction_users?.includes(senderId);
            return `<button class="reaction-btn ${has?'active':''}" onclick="toggleReaction('${m.id}','${em}')">${em} ${m[em]||0}</button>`
        }).join("")}
        </div>
        </div>`;
        wrap.innerHTML = html;
        box.appendChild(wrap);
    })
    box.scrollTop = box.scrollHeight;
}
supabase.channel("msg").on("postgres_changes",{event:"*",schema:"public",table:"messages",filter:`room_id=eq.${roomId}`},()=>loadMsg()).subscribe();
loadMsg();

async function sendMessage(){
    const i = document.getElementById("msgInput");
    const txt = i.value.trim();
    if(!txt) return;
    await supabase.from("messages").insert({
        room_id:roomId, sender_id:senderId, nickname:nickname,
        content:txt, type:"text", created_at:new Date().toISOString()
    })
    i.value = "";
}
async function sendImage(e){
    const f = e.target.files[0];
    if(!f) return;
    const name = Date.now()+"_"+f.name;
    const {data,error} = await supabase.storage.from("chatimg").upload(name,f);
    if(error) return alert("圖片上傳失敗");
    const {data:urlData} = supabase.storage.from("chatimg").getPublicUrl(name);
    await supabase.from("messages").insert({
        room_id:roomId, sender_id:senderId, nickname:nickname,
        content:urlData.publicUrl, type:"img", created_at:new Date().toISOString()
    })
    e.target.value = "";
}

// 錄音
let rec = null;
let recStream = null;
let recTimer = null;
let recSec = 0;
async function toggleRec(){
    if(rec){
        rec.stop();
        clearInterval(recTimer);
        rec = null;
        document.getElementById("recBtn").classList.remove("recording");
        document.getElementById("recTimer").textContent = "";
        return;
    }
    const s = await navigator.mediaDevices.getUserMedia({audio:true});
    recStream = s;
    rec = new MediaRecorder(s);
    const chunks = [];
    rec.ondataavailable = e=>chunks.push(e.data);
    rec.onstop = async ()=>{
        const blob = new Blob(chunks,{type:"audio/webm"});
        const url = URL.createObjectURL(blob);
        const ok = confirm("送出這段錄音嗎？取消就刪除");
        if(!ok){
            recStream.getTracks().forEach(t=>t.stop());
            URL.revokeObjectURL(url);
            return;
        }
        const name = Date.now()+".webm";
        const {data,err} = await supabase.storage.from("chataudio").upload(name,blob);
        if(err) return alert("錄音上傳失敗");
        const {data:urlData} = supabase.storage.from("chataudio").getPublicUrl(name);
        await supabase.from("messages").insert({
            room_id:roomId, sender_id:senderId, nickname:nickname,
            content:urlData.publicUrl, type:"audio", created_at:new Date().toISOString()
        })
        recStream.getTracks().forEach(t=>t.stop());
    }
    rec.start();
    document.getElementById("recBtn").classList.add("recording");
    recSec=0;
    recTimer = setInterval(()=>{
        recSec++;
        document.getElementById("recTimer").textContent = recSec+"s";
    },1000)
}

// 表情反應
async function toggleReaction(mid,em){
    const {data:msg} = await supabase.from("messages").select("reaction_users,"+em).eq("id",mid).single();
    let arr = msg.reaction_users || [];
    let cnt = msg[em]||0;
    if(arr.includes(senderId)){
        arr = arr.filter(x=>x!==senderId);
        cnt--;
    }else{
        arr.push(senderId);
        cnt++;
    }
    await supabase.from("messages").update({reaction_users:arr, [em]:cnt}).eq("id",mid);
}

// 公告
async function loadAnnounce(){
    const {data} = await supabase.from("announcements").select("*").eq("room_id","global").order("created_at",{desc:true});
    const listEl = document.getElementById("announceList");
    listEl.innerHTML = "";
    for(const a of data){
        const {data:replies} = await supabase.from("announcement_replies").select("*").eq("announcement_id",a.id).order("created_at",{asc:true});
        let repHtml = "";
        replies.forEach(r=>repHtml += `<div class="announce-reply"><b>${r.nickname}</b>：${r.content}</div>`);
        const div = document.createElement("div");
        div.className = "announce-item";
        div.innerHTML = `
        <div class="announce-content">${a.content}</div>
        <div class="msg-time">${formatTime(a.created_at)}</div>
        ${repHtml}
        ${a.allow_reply ? `<input class="announce-input" placeholder="回覆這則公告" onkeydown="if(event.key==='Enter')submitAnnReply(${a.id},this.value)">`:"<div style='color:#888'>關閉留言</div>"}
        `
        listEl.appendChild(div);
    }
}
async function submitAnnReply(aid,txt){
    txt = txt.trim();
    if(!txt) return;
    await supabase.from("announcement_replies").insert({
        announcement_id:aid, sender_id:senderId, nickname:nickname, content:txt
    })
    loadAnnounce();
}
supabase.channel("announce").on("postgres_changes",{event:"*",schema:"public",table:"announcements",filter:`room_id=eq.global`},()=>loadAnnounce()).subscribe();
supabase.channel("annrep").on("postgres_changes",{event:"*",schema:"public",table:"announcement_replies"},()=>loadAnnounce()).subscribe();
</script>
</body>
</html>
