<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匿名私信</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#121212;color:#eee;max-width:600px;margin:2rem auto;padding:0 1rem}
h2{text-align:center;margin-bottom:1.5rem;color:#ccc}
#chatBox{border:1px solid #333;border-radius:10px;padding:1rem;height:400px;overflow-y:auto;margin-bottom:1rem;background:#181818}
.msg{margin-bottom:1rem;padding:0.6rem;border-radius:8px;background:#222}
.msg-text{margin-bottom:0.3rem}
.msg-time{font-size:0.75rem;color:#aaa}
#inputArea{display:flex;gap:0.5rem}
#msgInput{flex:1;padding:0.7rem;border-radius:8px;border:none;background:#222;color:#eee}
#sendBtn{padding:0 1rem;border:none;border-radius:8px;background:#448aff;color:#fff}
</style>
</head>
<body>
<h2>匿名私信</h2>
<div id="chatBox"></div>
<div id="inputArea">
  <input id="msgInput" placeholder="輸入訊息...">
  <button id="sendBtn">送出</button>
</div>

<script>
// 這裡換成你的 Supabase 資訊
const SUPABASE_URL = "你的URL";
const SUPABASE_KEY = "你的anon key";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== 台灣時區時間函式 =====
function formatTaiwanTime(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleString('zh-TW', {
    timeZone: 'Asia/Taipei',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  })
}

const chatBox = document.getElementById('chatBox');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

// 讀訊息
async function loadMessages() {
  const { data } = await supabase
    .from('messages')
    .select('*')
    .order('created_at', { ascending:true });
  renderMsg(data);
}

function renderMsg(list) {
  chatBox.innerHTML = '';
  list.forEach(msg=>{
    const div = document.createElement('div');
    div.className = "msg";
    div.innerHTML = `
      <div class="msg-text">${msg.content}</div>
      <div class="msg-time">${formatTaiwanTime(msg.created_at)}</div>
    `
    chatBox.appendChild(div);
  })
  chatBox.scrollTop = chatBox.scrollHeight;
}

// 送訊息
sendBtn.onclick = async ()=>{
  const content = msgInput.value.trim();
  if(!content) return;
  await supabase.from('messages').insert([{content}]);
  msgInput.value = '';
  loadMessages();
}

// 即時監聽
supabase.channel('messages')
.on('postgres_changes', {event:'*', schema:'public', table:'messages'}, payload=>{
  loadMessages();
}).subscribe();

loadMessages();
</script>
</body>
</html>
