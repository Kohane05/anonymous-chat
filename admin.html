<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
body{background:linear-gradient(160deg,#fff7f5,#fff1f3);color:#5c4a4a;padding:1rem;max-width:900px;margin:0 auto}
h2{text-align:center;margin-bottom:1.2rem;color:#e8839b;font-weight:700}

.msg-nick{font-size:.75rem;color:#e8839b;font-weight:600;margin-bottom:.2rem}

textarea{flex:1;padding:.65rem;background:#fff;border:1px solid #fbe4e8;border-radius:14px;color:#5c4a4a;resize:none;font-family:inherit}
textarea:focus{outline:none;border-color:#ffb6c1;box-shadow:0 0 0 3px rgba(255,182,193,.2)}
button{padding:0 .9rem;background:linear-gradient(135deg,#ffb6c1,#ffc9a9);color:#fff;border:none;border-radius:14px;cursor:pointer;font-weight:600}

.ann-admin{border:1px solid #f6dde2;border-radius:18px;background:#fff;padding:1rem;margin-bottom:1.2rem;box-shadow:0 4px 14px rgba(232,131,155,.10)}

function formatTime(isoString){
  if(!isoString) return "";
  const date = new Date(isoString);
  if(isNaN(date.getTime())) return String(isoString);
  const fmt = new Intl.DateTimeFormat("zh-TW", {
    timeZone: "Asia/Taipei",
    month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit",
    hour12: false
  });
  const parts = fmt.formatToParts(date);
  const get = t => (parts.find(p => p.type === t) || {}).value || "";
  let hh = get("hour");
  if(hh === "24") hh = "00";
  return `${get("month")}-${get("day")} ${hh}:${get("minute")}`;
}

function linkify(text){
  if(!text) return "";
  const escaped = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
  return escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

function getVisitorNick(senderId){
  if(!senderId || senderId.trim() === "") return "匿名訪客";
  let hash = 0;
  for(let i=0; i<senderId.length; i++){
    hash = ((hash << 5) - hash) + senderId.charCodeAt(i);
    hash |= 0;
  }
  const num = Math.abs(hash) % 900 + 100;
  return `訪客 #${num}`;
}

const roomOldestTime = {};
const PAGE_SIZE = 30;
const roomReply = {};
const roomImage = {};
const roomAudio = {};

let recorder = null;
let audioChunks = [];
let micStream = null;
let recordingRoom = null;
let recTimerId = null;
let recSeconds = 0;
let audioDiscarded = false;
const MAX_REC_SECONDS = 60;

function fmtSec(s){
  const m = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return `${m}:${ss}`;
}
function startRecTimer(roomId){
  recSeconds = 0;
  const el = document.getElementById(`recTimer-${roomId}`);
  if(el){ el.textContent = fmtSec(0); el.style.display = "inline-block"; }
  recTimerId = setInterval(()=>{
    recSeconds++;
    const t = document.getElementById(`recTimer-${recordingRoom}`);
    if(t) t.textContent = fmtSec(recSeconds);
    if(recSeconds >= MAX_REC_SECONDS) toggleRecord(recordingRoom);
  }, 1000);
}
function stopRecTimer(){
  if(recTimerId){ clearInterval(recTimerId); recTimerId = null; }
  if(recordingRoom){
    const t = document.getElementById(`recTimer-${recordingRoom}`);
    if(t) t.style.display = "none";
  }
}

function getReactionRecord(){
  try {
    return JSON.parse(localStorage.getItem("reaction_record") || "{}");
  } catch(e){
    return {};
  }
}
function setReactionRecord(record){
  localStorage.setItem("reaction_record", JSON.stringify(record));
}

async function loadAllRooms(){
  const {data:allMsg, error} = await sb
    .from("messages")
    .select("room_id, created_at")
    .order("created_at",{ascending:false});

  if(error) {
    console.log("載入錯誤：", error);
    return;
  }

  const roomIds = [...new Set(allMsg.map(m=>m.room_id))];
  const box = document.getElementById("container");
  box.innerHTML = "";

  for(const roomId of roomIds){
    const roomDiv = document.createElement("div");
    roomDiv.className = "room";
    roomDiv.innerHTML = `
      <div class="room-header" onclick="toggleRoom('${roomId}')">
        <div class="room-id">房間ID：${roomId}</div>
        <div class="room-toggle" id="toggle-${roomId}">−</div>
      </div>
      <div class="room-body" id="body-${roomId}">
        <button class="load-more" onclick="loadMoreMsg('${roomId}')">載入更早訊息</button>
        <div class="msg-list" id="r-${roomId}"></div>
        <div class="reply-status" id="replyStatus-${roomId}">
          回覆：<span id="replyText-${roomId}"></span>
          <span onclick="cancelRoomReply('${roomId}')">✕</span>
        </div>
        <div class="image-preview" id="imgPreview-${roomId}">
          <img id="imgPrev-${roomId}">
          <span onclick="clearRoomImage('${roomId}')">✕</span>
        </div>
        <div class="audio-preview" id="audioPreview-${roomId}">
          <audio id="audioEl-${roomId}" controls preload="metadata"></audio>
          <span class="dur" id="audioDur-${roomId}"></span>
          <button class="discard" onclick="clearRoomAudio('${roomId}')">捨棄</button>
        </div>
        <div class="emoji-panel" id="emojiPanel-${roomId}">
          <span>😀</span><span>😂</span><span>🥰</span><span>👍</span><span>😭</span>
          <span>😡</span><span>😮</span><span>🎉</span><span>💯</span><span>❤️</span>
        </div>
        <div class="reply-area">
          <button class="emoji-btn" onclick="toggleRoomEmoji('${roomId}')">😊</button>
          <button class="emoji-btn" onclick="document.getElementById('imgInput-${roomId}').click()">📎</button>
          <button class="emoji-btn rec-btn" id="recBtn-${roomId}" onclick="toggleRecord('${roomId}')">🎤</button>
          <span class="rec-timer" id="recTimer-${roomId}" style="display:none">00:00</span>
          <input type="file" id="imgInput-${roomId}" accept="image/*" style="display:none">
          <textarea id="rep-${roomId}" placeholder="回覆訊息..." rows="2"></textarea>
          <button onclick="sendAdminMsg('${roomId}')">送出回覆</button>
        </div>
      </div>`;
    box.appendChild(roomDiv);

    setTimeout(()=>{
      document.querySelectorAll(`#emojiPanel-${roomId} span`).forEach(el=>{
        el.onclick = ()=>{
          document.getElementById(`rep-${roomId}`).value += el.innerText;
          document.getElementById(`rep-${roomId}`).focus();
        };
      });
      document.getElementById(`imgInput-${roomId}`).onchange = async function(e){
        const file = e.target.files[0];
        if(!file) return;
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await new Promise(r=>img.onload = r);

        const maxWidth = 800;
        let w = img.width, h = img.height;
        if(w > maxWidth){
          h = h * maxWidth / w;
          w = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);

        roomImage[roomId] = canvas.toDataURL("image/jpeg", 0.8);
        document.getElementById(`imgPrev-${roomId}`).src = roomImage[roomId];
        document.getElementById(`imgPreview-${roomId}`).style.display = "block";
        e.target.value = "";
      };

      document.getElementById(`rep-${roomId}`).addEventListener("paste", async function(e){
        const items = e.clipboardData?.items;
        if(!items) return;

        for(const item of items){
          if(item.type.startsWith("image/")){
            e.preventDefault();
            const file = item.getAsFile();
            if(file){
              const img = new Image();
              img.src = URL.createObjectURL(file);
              await new Promise(r=>img.onload = r);

              const maxWidth = 800;
              let w = img.width, h = img.height;
              if(w > maxWidth){
                h = h * maxWidth / w;
                w = maxWidth;
              }
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              canvas.getContext("2d").drawImage(img, 0, 0, w, h);

              roomImage[roomId] = canvas.toDataURL("image/jpeg", 0.8);
              document.getElementById(`imgPrev-${roomId}`).src = roomImage[roomId];
              document.getElementById(`imgPreview-${roomId}`).style.display = "block";

function toggleRoomEmoji(roomId){

function clearRoomAudio(roomId){
  audioDiscarded = true;
  if(recorder){ try{ recorder.stop(); }catch(e){} }
  stopRecTimer();
  roomAudio[roomId] = null;
  const player = document.getElementById(`audioEl-${roomId}`);
  if(player){ try{ player.pause(); }catch(e){} player.removeAttribute("src"); player.load(); }
  document.getElementById(`audioPreview-${roomId}`).style.display = "none";
  const dur = document.getElementById(`audioDur-${roomId}`);
  if(dur) dur.textContent = "";
  const btn = document.getElementById(`recBtn-${roomId}`);
  if(btn){ btn.innerText = "🎤"; btn.classList.remove("recording"); }
}

async function toggleRecord(roomId){
  if(recorder){
    recorder.stop();
    return;
  }
  try{
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
      ? "audio/webm;codecs=opus"
      : (MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "");
    recorder = mime ? new MediaRecorder(micStream, { type: mime }) : new MediaRecorder(micStream);
    audioChunks = [];
    recordingRoom = roomId;

    recorder.ondataavailable = e => { if(e.data && e.data.size) audioChunks.push(e.data); };

    recorder.onstop = () => {
      stopRecTimer();
      const mime = recorder ? recorder.mimeType : "";
      const stoppedRoom = recordingRoom;
      if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
      recorder = null;
      const btn = document.getElementById(`recBtn-${stoppedRoom}`);
      if(btn){ btn.innerText = "🎤"; btn.classList.remove("recording"); }
      recordingRoom = null;

      if(audioDiscarded) return;

      const blob = new Blob(audioChunks, { type: mime || "audio/webm" });
      const reader = new FileReader();
      reader.onloadend = () => {
        roomAudio[stoppedRoom] = reader.result;
        const player = document.getElementById(`audioEl-${stoppedRoom}`);
        player.src = roomAudio[stoppedRoom];
        player.onloadedmetadata = () => {
          const dur = Math.round(player.duration || recSeconds);
          const durEl = document.getElementById(`audioDur-${stoppedRoom}`);
          if(durEl) durEl.textContent = fmtSec(dur);
        };
        document.getElementById(`audioPreview-${stoppedRoom}`).style.display = "flex";
      };
      reader.readAsDataURL(blob);
    };

    audioDiscarded = false;
    recorder.start();
    startRecTimer(roomId);
    const btn = document.getElementById(`recBtn-${roomId}`);
    btn.innerText = "⏹";
    btn.classList.add("recording");
  }catch(err){
    alert("無法取得麥克風權限，請允許麥克風權限後再試");
    console.error(err);
    if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
    recorder = null;
    stopRecTimer();
  }
}

window.addReaction = async function(roomId, msgId, emoji){
  try {
    const record = getReactionRecord();
    const key = `${msgId}_${emoji}`;
    const hasReacted = !!record[key];

    updateReactionDom(roomId, msgId, emoji, hasReacted ? -1 : 1);
    if(hasReacted) delete record[key];
    else record[key] = true;
    setReactionRecord(record);

    const {data: row, error: selectErr} = await sb
      .from("messages")
      .select("reactions")
      .eq("id", msgId)
      .single();
    if(selectErr) throw selectErr;

    const current = row.reactions && typeof row.reactions === 'object' ? row.reactions : {};
    current[emoji] = (current[emoji] || 0) + (hasReacted ? -1 : 1);
    if(current[emoji] <= 0) delete current[emoji];

    const {error: updateErr} = await sb
      .from("messages")
      .update({ reactions: current })
      .eq("id", msgId);
    if(updateErr) throw updateErr;

  } catch(e) {
    console.error("表情更新失敗：", e);
    const record = getReactionRecord();
    const key = `${msgId}_${emoji}`;
    const hasReacted = !!record[key];
    updateReactionDom(roomId, msgId, emoji, hasReacted ? 1 : -1);
    if(hasReacted) record[key] = true;
    else delete record[key];
    setReactionRecord(record);
  }
};

function updateReactionDom(roomId, msgId, emoji, delta){
  const listEl = document.getElementById(`r-${roomId}`);
  if(!listEl) return;
  const msgEl = listEl.querySelector(`.msg[data-id="${msgId}"]`);
  if(!msgEl) return;

  let reactionsBox = msgEl.querySelector(".msg-reactions");
  let target = reactionsBox ? reactionsBox.querySelector(`[data-emoji="${emoji}"]`) : null;
  let count = target ? parseInt(target.dataset.count) : 0;
  count += delta;

  if(count <= 0){
    if(target) target.remove();
  } else {
    if(target){
      target.dataset.count = count;
      target.childNodes[0].textContent = `${emoji} ${count}`;
    } else {
      if(!reactionsBox){
        reactionsBox = document.createElement("div");
        reactionsBox.className = "msg-reactions";
        const textSpan = msgEl.querySelector("span");
        textSpan.appendChild(reactionsBox);
      }
      const span = document.createElement("span");
      span.className = "reaction-item";
      span.dataset.emoji = emoji;
      span.dataset.count = count;
      span.innerText = `${emoji} ${count}`;
      span.onclick = ()=>addReaction(roomId, msgId, emoji);
      reactionsBox.appendChild(span);
    }
  }
  if(reactionsBox && reactionsBox.children.length === 0) reactionsBox.remove();
}

async function loadRoomMsg(roomId, isFirstLoad = false){
  let query = sb
    .from("messages")
    .select("*")
    .eq("room_id", roomId)
    .order("created_at",{ascending:true})
    .limit(PAGE_SIZE);

  if(!isFirstLoad && roomOldestTime[roomId]){
    query = query.lt("created_at", roomOldestTime[roomId]);
  }

  const {data, error} = await query;
  if(error) return;

  const listEl = document.getElementById(`r-${roomId}`);

  if(isFirstLoad){
    listEl.innerHTML = "";
    if(data.length > 0) roomOldestTime[roomId] = data[0].created_at;
    data.forEach(m=>listEl.appendChild(createMsgElement(roomId, m, data)));
    listEl.scrollTop = listEl.scrollHeight;
  }else{
    if(data.length > 0) roomOldestTime[roomId] = data[0].created_at;
    const beforeHeight = listEl.scrollHeight;
    const fragment = document.createDocumentFragment();
    data.forEach(m=>fragment.appendChild(createMsgElement(roomId, m, data)));
    listEl.insertBefore(fragment, listEl.firstChild);
    listEl.scrollTop += listEl.scrollHeight - beforeHeight;
  }
}

function createMsgElement(roomId, m, allRows){
  const div = document.createElement("div");

  let isMe = false;
  if(m.sender_id && m.sender_id.trim() !== ""){
    isMe = m.sender_id === ADMIN_SENDER_ID;
  } else {
    isMe = m.is_admin;
  }
  div.className = "msg "+(isMe ? "admin" : "visitor");
  div.dataset.id = m.id;

  let inner = "";
  const nick = isMe ? ADMIN_NICKNAME : getVisitorNick(m.sender_id);
  inner += `<div class="msg-nick">${nick}</div>`;

  if(m.reply_to){
    const target = allRows ? allRows.find(x=>x.id === m.reply_to) : null;
    const quoteText = target ? target.content : "已刪除的訊息";
    const short = linkify(quoteText.length > 18 ? quoteText.slice(0,18)+"..." : quoteText);
    inner += `<div class="reply-quote">↩ ${short}</div>`;
  }

  if(m.image){
    inner += `<img src="${m.image}" alt="圖片">`;
  }

  if(m.audio){
    inner += `<audio controls preload="metadata"><source src="${m.audio}" type="audio/webm"></audio>`;
  }

  inner += `<span>${linkify(m.content || "")}<br><small>${formatTime(m.created_at)}</small>`;

  if(m.reactions && Object.keys(m.reactions).length > 0){
    inner += '<div class="msg-reactions">';
    Object.entries(m.reactions).forEach(([emoji, count])=>{
      inner += `<span class="reaction-item" data-emoji="${emoji}" data-count="${count}" onclick="addReaction('${roomId}', ${m.id}, '${emoji}')">${emoji} ${count}</span>`;
    });
    inner += '</div>';
  }
  inner += `</span>`;

  inner += '<span><div class="msg-reaction-bar">';
  QUICK_EMOJIS.forEach(e=>{
    inner += `<span onclick="addReaction('${roomId}', ${m.id}, '${e}')">${e}</span>`;
  });
  inner += '</div></span>';

  const replyText = m.content ? m.content.replace(/'/g,"\\'") : "圖片/語音";
  inner += `
    <button class="reply-btn" onclick="setRoomReply('${roomId}', ${m.id}, '${replyText}')">回覆</button>
    <button class="del-btn" onclick="delMsg('${roomId}', ${m.id})">刪除</button>
  `;

  div.innerHTML = inner;
  return div;
}

async function loadMoreMsg(roomId){
  await loadRoomMsg(roomId, false);
}

function toggleRoom(roomId){
  const body = document.getElementById(`body-${roomId}`);
  const toggle = document.getElementById(`toggle-${roomId}`);
  if(body.style.display === "none"){
    body.style.display = "block";
    toggle.innerText = "−";
  }else{
    body.style.display = "none";
    toggle.innerText = "+";
  }
}

async function delMsg(roomId, id){
  const {error} = await sb.from("messages").delete().eq("id",id);
  if(error) {
    console.log("刪除錯誤：",error);
    return;
  }
  await loadRoomMsg(roomId, true);
}

async function sendAdminMsg(roomId){
  const txt = document.getElementById(`rep-${roomId}`).value.trim();
  if(!txt && !roomImage[roomId] && !roomAudio[roomId]) return;

  const payload = {
    room_id: roomId,
    content: txt,
    is_admin: true,
    sender_id: ADMIN_SENDER_ID,
    nickname: ADMIN_NICKNAME,
    created_at: new Date().toISOString()
  };
  if(roomReply[roomId]) payload.reply_to = roomReply[roomId];
  if(roomImage[roomId]) payload.image = roomImage[roomId];
  if(roomAudio[roomId]) payload.audio = roomAudio[roomId];

  const {error} = await sb.from("messages").insert([payload]);
  if(error) console.log("送出錯誤：",error);

  document.getElementById(`rep-${roomId}`).value = "";
  cancelRoomReply(roomId);
  clearRoomImage(roomId);
  clearRoomAudio(roomId);
  setTimeout(()=>loadRoomMsg(roomId, true), 300);
}

async function loadAdminAnnouncements(){
  const listEl = document.getElementById("annList");
  if(!listEl) return;

  const {data: anns, error} = await sb
    .from("announcements")
    .select("*")
    .eq("room_id", GLOBAL_ROOM)
    .order("created_at",{ascending:false});

  if(error){
    listEl.innerHTML = '<div style="color:#c0395a;font-size:.8rem">載入公告失敗：' + error.message + '</div>';
    console.error("公告載入失敗：", error);
    return;
  }
  if(!anns || anns.length === 0){
    listEl.innerHTML = '<div style="color:#a88b8f;font-size:.85rem;text-align:center;padding:.8rem">暫無公告</div>';
    return;
  }

  listEl.innerHTML = "";
  anns.forEach(ann=>{
    const allow = !!ann.allow_reply;
    const item = document.createElement("div");
    item.className = "ann-item";
    item.innerHTML = `
      <div class="ann-item-head">
        <div class="ann-item-time">${formatTime(ann.created_at)}</div>
        <div class="ann-item-actions">
          <button class="ann-btn-outline" onclick="toggleAnnReply('${ann.id}', ${allow ? "false" : "true"})">${allow ? "關閉留言" : "開啟留言"}</button>
          <button class="ann-btn-danger" onclick="deleteAnnouncement('${ann.id}')">刪除</button>
        </div>
      </div>
      <div class="ann-item-content">${linkify(ann.content||"").replace(/\n/g,"<br>")}</div>
      <div class="ann-reply-count">💬 ${allow ? "開放留言" : "已關閉留言"}</div>
    `;
    listEl.appendChild(item);
  });
}

async function publishAnnouncement(){
  const input = document.getElementById("annInput");
  const content = input.value.trim();
  if(!content) return;

  const {error} = await sb.from("announcements").insert([{
    room_id: GLOBAL_ROOM,
    content: content,
    allow_reply: true,
    created_at: new Date().toISOString()
  }]);

  if(error){
    alert("發布失敗：" + error.message);
    console.error("發布公告錯誤：", error);
    return;
  }
  input.value = "";
  loadAdminAnnouncements();
}

async function toggleAnnReply(annId, allow){
  const {error} = await sb.from("announcements")
    .update({ allow_reply: allow })
    .eq("id", annId);

  if(error){
    alert("切換失敗：" + error.message);
    console.error("更新公告錯誤：", error);
    return;
  }
  loadAdminAnnouncements();
}

async function deleteAnnouncement(annId){
  if(!confirm("確定刪除此公告？底下留言會一併刪除。")) return;

  const {error} = await sb.from("announcements").delete().eq("id", annId);
  if(error){
    alert("刪除失敗：" + error.message);
    console.error("刪除公告錯誤：", error);
    return;
  }
  loadAdminAnnouncements();
}

sb.channel("all")
  .on("postgres_changes",{event:"*",schema:"public",table:"messages"},(payload)=>{
    const newMsg = payload.new;
    if(payload.eventType === "INSERT"){
      showNotify("有新匿名訊息", `房間 ${newMsg.room_id} 收到新訊息`);
      const listEl = document.getElementById(`r-${newMsg.room_id}`);
      if(listEl){
        loadRoomMsg(newMsg.room_id, true);
      }else{
        loadAllRooms();
      }
    } else if(payload.eventType === "UPDATE"){
      updateReactionDomFull(newMsg.room_id, newMsg.id, newMsg.reactions);
    }
  })
  .subscribe();

function updateReactionDomFull(roomId, msgId, reactions){
  const listEl = document.getElementById(`r-${roomId}`);
  if(!listEl) return;
  const msgEl = listEl.querySelector(`.msg[data-id="${msgId}"]`);
  if(!msgEl) return;

  let reactionsBox = msgEl.querySelector(".msg-reactions");
  if(!reactionsBox){
    reactionsBox = document.createElement("div");
    reactionsBox.className = "msg-reactions";
    const textSpan = msgEl.querySelector("span");
    textSpan.appendChild(reactionsBox);
  }
  reactionsBox.innerHTML = "";
  if(reactions && Object.keys(reactions).length > 0){
    Object.entries(reactions).forEach(([emoji, count])=>{
      const span = document.createElement("span");
      span.className = "reaction-item";
      span.dataset.emoji = emoji;
      span.dataset.count = count;
      span.innerText = `${emoji} ${count}`;
      span.onclick = ()=>addReaction(roomId, msgId, emoji);
      reactionsBox.appendChild(span);
    });
  } else {
    reactionsBox.remove();
  }
}

loadAllRooms();
loadAdminAnnouncements();

sb.channel("ann-admin")
  .on("postgres_changes",{event:"*",schema:"public",table:"announcements"},()=>loadAdminAnnouncements())
  .subscribe();
</script>
