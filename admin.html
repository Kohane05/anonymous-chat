<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理後台｜匿名私信</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111;color:#eee;padding:1rem;max-width:900px;margin:0 auto}
h2{text-align:center;margin-bottom:1rem}
.room{border:1px solid #333;border-radius:8px;padding:1rem;margin-bottom:1rem;background:#181818}
.room-id{color:#888;font-size:0.8rem;margin-bottom:0.5rem}
.msg-item{padding:0.4rem 0;border-bottom:1px solid #222}
.del-btn{margin-left:0.5rem;background:#a33;color:#fff;border:none;border-radius:4px;padding:0.2rem 0.4rem;cursor:pointer}
</style>
</head>
<body>
<h2>管理後台</h2>
<div id="container"></div>

<script>
// 替換成你的 Supabase URL 跟 anon key
const SUPABASE_URL = "你的SUPABASE_URL";
const SUPABASE_KEY = "你的ANON_KEY";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ========== 通知 + 提示音 ==========
let notifyAudio = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3");
async function requestNotify() {
  if (!("Notification" in window)) return false;
  const perm = await Notification.requestPermission();
  return perm === "granted";
}
function showNotify(title, body) {
  if (Notification.permission === "granted") {
    new Notification(title, { body });
  }
  notifyAudio.play().catch(e=>{});
}
requestNotify();

const container = document.getElementById("container");

async function loadAllRooms() {
  const { data } = await supabase
    .from("messages")
    .select("*")
    .order("created_at", { ascending:true });
  const group = {};
  data.forEach(m=>{
    if(!group[m.room_id]) group[m.room_id] = [];
    group[m.room_id].push(m);
  })
  renderRooms(group);
}
function renderRooms(groups) {
  container.innerHTML = "";
  Object.keys(groups).forEach(rid=>{
    const wrap = document.createElement("div");
    wrap.className = "room";
    wrap.innerHTML = `<div class="room-id">房間ID：${rid}</div>`;
    groups[rid].forEach(msg=>{
      const line = document.createElement("div");
      line.className = "msg-item";
      line.innerText = msg.content;
      const del = document.createElement("button");
      del.className = "del-btn";
      del.innerText = "刪除";
      del.onclick = async ()=>{
        await supabase.from("messages").delete().eq("id", msg.id);
        loadAllRooms();
      }
      line.appendChild(del);
      wrap.appendChild(line);
    })
    container.appendChild(wrap);
  })
}

// 監聽全部訊息，有新訊息就通知管理員
supabase.channel("admin-all")
.on("postgres_changes", {
  event:"INSERT",
  schema:"public",
  table:"messages"
}, ()=>{
  loadAllRooms();
  showNotify("有新匿名訊息", "某個聊天室收到訊息");
})
.subscribe();

loadAllRooms();
</script>
</body>
</html>
