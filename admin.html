<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理後台｜匿名私信</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111;color:#eee;padding:1rem;max-width:900px;margin:0 auto}
h2{text-align:center;margin-bottom:1rem}
.room{border:1px solid #333;border-radius:8px;margin-bottom:1rem;background:#181818;overflow:hidden}
.room-header{padding:0.8rem 1rem;background:#1f1f1f;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.room-id{color:#888;font-size:0.85rem}
.room-toggle{color:#666;font-size:1.2rem}
.room-body{padding:0 1rem 1rem;display:block}
.msg-list{height:300px;overflow-y:auto;padding-right:0.5rem;margin:0.8rem 0;border-bottom:1px solid #252525;display:flex;flex-direction:column}
.msg{padding:0.6rem;border-radius:6px;margin:0.4rem 0;max-width:80%;word-break:break-word;position:relative;line-height:1.4}
.visitor{background:#272727;margin-right:auto}
.admin{background:#203b58;margin-left:auto;text-align:right}
.msg-nick{font-size:0.75rem;color:#8ab4f8;font-weight:500;margin-bottom:0.2rem}
.visitor .msg-nick{text-align:left}
.reply-quote{font-size:0.7rem;color:#aaa;border-left:2px solid #555;padding-left:0.4rem;margin-bottom:0.3rem;opacity:0.8;text-align:left}
.reply-btn{font-size:0.7rem;background:none;border:none;color:#aaa;cursor:pointer;margin-right:0.5rem}
.del-btn{background:#8b2222;border:none;color:#fff;padding:0.2rem 0.5rem;border-radius:4px;cursor:pointer;font-size:0.75rem;flex-shrink:0;margin-left:0.8rem}

/* 表情反應 */
.msg-reactions{display:flex;gap:0.3rem;margin-top:0.3rem;flex-wrap:wrap;justify-content:flex-end}
.visitor .msg-reactions{justify-content:flex-start}
.reaction-item{background:#222;border:1px solid #444;border-radius:12px;padding:0.1rem 0.4rem;font-size:0.8rem;cursor:pointer}
.msg-reaction-bar{
  position:absolute;bottom:-12px;left:6px;
  display:none;gap:0.2rem;background:#1a1a1a;
  border:1px solid #333;border-radius:20px;padding:0.15rem 0.4rem;z-index:10
}
.msg:hover .msg-reaction-bar{display:flex}
.admin .msg-reaction-bar{left:auto;right:6px}
.msg-reaction-bar span{cursor:pointer;font-size:0.85rem;padding:0 0.15rem}

.load-more{width:100%;padding:0.4rem;background:#222;border:1px solid #333;color:#aaa;border-radius:4px;cursor:pointer;margin-bottom:0.6rem;font-size:0.8rem}
.load-more:hover{background:#2a2a2a}
.reply-status{font-size:0.75rem;color:#8ab4f8;margin-bottom:0.4rem;display:none}
.reply-status span{cursor:pointer;color:#aaa;margin-left:0.5rem}
.reply-area{display:flex;gap:0.5rem;align-items:flex-end}
.emoji-btn{padding:0 0.6rem;background:#222;border:1px solid #444;color:#fff;border-radius:6px;cursor:pointer;font-size:1rem}
.emoji-panel{display:none;gap:0.4rem;padding:0.5rem;background:#1e1e1e;border:1px solid #333;border-radius:6px;margin-bottom:0.4rem;flex-wrap:wrap}
.emoji-panel span{font-size:1.1rem;cursor:pointer;padding:0.2rem 0.3rem;border-radius:4px}
.emoji-panel span:hover{background:#2a2a2a}
textarea{flex:1;padding:0.6rem;background:#222;border:1px solid #444;border-radius:6px;color:#fff;resize:none}
button{padding:0 0.8rem;background:#3670b9;color:white;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<h2>管理後台</h2>
<div id="container"></div>

<script>
const SUPABASE_URL = "https://lwbqcmvwqtlcgsccezxb.supabase.co";
const SUPABASE_KEY = "sb_publishable_jW632EqSBRq4hBCM4xdP4A_1ftKbvMM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_SENDER_ID = "admin";
const ADMIN_NICKNAME = "管理員";
const QUICK_EMOJIS = ["👍","❤️","😂","😮","😭"];

// 格式化時間：月-日 時:分，自動轉台北時區
function formatTime(isoString){
  let s = String(isoString).trim();
  if(!/[Zz]|[+-]\d{2}/.test(s)){
    s = s.replace(' ', 'T') + 'Z';
  } else if(/[+-]\d{2}$/.test(s)){
    s += ':00';
  }
  const date = new Date(s);
  const fmt = new Intl.DateTimeFormat('zh-TW', {
    timeZone: 'Asia/Taipei',
    month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit',
    hour12: false
  });
  return fmt.format(date).replace(/\//g, '-');
}

// 通知 + 提示音
const notifyAudio = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3");
async function requestNotify() {
  if (!("Notification" in window)) return false;
  const perm = await Notification.requestPermission();
  return perm === "granted";
}
function showNotify(title, body) {
  if (document.hidden && Notification.permission === "granted") {
    new Notification(title, { body });
  }
  notifyAudio.play().catch(e=>{});
}
requestNotify();

const roomOldestTime = {};
const PAGE_SIZE = 30;
const roomReply = {};

// 讀取本機表情紀錄
function getReactionRecord(){
  try {
    return JSON.parse(localStorage.getItem("reaction_record") || "{}");
  } catch(e){
    return {};
  }
}
function setReactionRecord(record){
  localStorage.setItem("reaction_record", JSON.stringify(record));
}

async function loadAllRooms(){
  const {data:allMsg, error} = await sb
    .from("messages")
    .select("room_id, created_at")
    .order("created_at",{asc:false})
  
  if(error) {
    console.log("載入錯誤：", error);
    return;
  }

  const roomIds = [...new Set(allMsg.map(m=>m.room_id))];
  const box = document.getElementById("container");
  box.innerHTML = "";

  for(const roomId of roomIds){
    const roomDiv = document.createElement("div");
    roomDiv.className = "room";
    roomDiv.innerHTML = `
      <div class="room-header" onclick="toggleRoom('${roomId}')">
        <div class="room-id">房間ID：${roomId}</div>
        <div class="room-toggle" id="toggle-${roomId}">−</div>
      </div>
      <div class="room-body" id="body-${roomId}">
        <button class="load-more" onclick="loadMoreMsg('${roomId}')">載入更早訊息</button>
        <div class="msg-list" id="r-${roomId}"></div>
        <div class="reply-status" id="replyStatus-${roomId}">
          回覆：<span id="replyText-${roomId}"></span>
          <span onclick="cancelRoomReply('${roomId}')">✕</span>
        </div>
        <div class="emoji-panel" id="emojiPanel-${roomId}">
          <span>😀</span><span>😂</span><span>🥰</span><span>👍</span><span>😭</span>
          <span>😡</span><span>😮</span><span>🎉</span><span>💯</span><span>❤️</span>
        </div>
        <div class="reply-area">
          <button class="emoji-btn" onclick="toggleRoomEmoji('${roomId}')">😊</button>
          <textarea id="rep-${roomId}" placeholder="回覆訊息..."></textarea>
          <button onclick="sendAdminMsg('${roomId}')">送出回覆</button>
        </div>
      </div>`
    box.appendChild(roomDiv);

    setTimeout(()=>{
      document.querySelectorAll(`#emojiPanel-${roomId} span`).forEach(el=>{
        el.onclick = ()=>{
          const input = document.getElementById(`rep-${roomId}`);
          input.value += el.innerText;
          input.focus();
        }
      })
    },0)

    await loadRoomMsg(roomId, true);
  }
}

function toggleRoomEmoji(roomId){
  const panel = document.getElementById(`emojiPanel-${roomId}`);
  panel.style.display = panel.style.display === "flex" ? "none" : "flex";
}

function setRoomReply(roomId, msgId, content){
  roomReply[roomId] = msgId;
  document.getElementById(`replyText-${roomId}`).innerText = content.length > 20 ? content.slice(0,20)+"..." : content;
  document.getElementById(`replyStatus-${roomId}`).style.display = "block";
  document.getElementById(`rep-${roomId}`).focus();
}

function cancelRoomReply(roomId){
  roomReply[roomId] = null;
  document.getElementById(`replyStatus-${roomId}`).style.display = "none";
}

// ✅ 表情反應：樂觀更新，不跳動
window.addReaction = async function(roomId, msgId, emoji){
  const record = getReactionRecord();
  const key = `${msgId}_${emoji}`;
  const hasReacted = !!record[key];

  // 樂觀更新 DOM
  updateReactionDom(roomId, msgId, emoji, hasReacted ? -1 : 1);

  if(hasReacted){
    delete record[key];
  }else{
    record[key] = true;
  }
  setReactionRecord(record);

  try {
    const {data: row, error: selectErr} = await sb
      .from("messages")
      .select("reactions")
      .eq("id", msgId)
      .single();
    if(selectErr) throw selectErr;

    const current = row.reactions && typeof row.reactions === 'object' ? row.reactions : {};
    current[emoji] = (current[emoji] || 0) + (hasReacted ? -1 : 1);
    if(current[emoji] <= 0) delete current[emoji];

    const {error: updateErr} = await sb
      .from("messages")
      .update({ reactions: current })
      .eq("id", msgId);
    if(updateErr) throw updateErr;
  } catch(e) {
    console.error("表情同步失敗：", e);
    // 失敗復原
    updateReactionDom(roomId, msgId, emoji, hasReacted ? 1 : -1);
    if(hasReacted){
      record[key] = true;
    }else{
      delete record[key];
    }
    setReactionRecord(record);
  }
}

// 局部更新單則訊息表情
function updateReactionDom(roomId, msgId, emoji, delta){
  const listEl = document.getElementById(`r-${roomId}`);
  if(!listEl) return;
  const msgEl = listEl.querySelector(`.msg[data-id="${msgId}"]`);
  if(!msgEl) return;

  let reactionsBox = msgEl.querySelector(".msg-reactions");
  let target = reactionsBox ? reactionsBox.querySelector(`[data-emoji="${emoji}"]`) : null;

  let count = target ? parseInt(target.dataset.count) : 0;
  count += delta;

  if(count <= 0){
    if(target) target.remove();
  } else {
    if(target){
      target.dataset.count = count;
      target.childNodes[0].textContent = `${emoji} ${count}`;
    } else {
      if(!reactionsBox){
        reactionsBox = document.createElement("div");
        reactionsBox.className = "msg-reactions";
        const textSpan = msgEl.querySelector("span");
        textSpan.appendChild(reactionsBox);
      }
      const span = document.createElement("span");
      span.className = "reaction-item";
      span.dataset.emoji = emoji;
      span.dataset.count = count;
      span.innerText = `${emoji} ${count}`;
      span.onclick = ()=>addReaction(roomId, msgId, emoji);
      reactionsBox.appendChild(span);
    }
  }

  if(reactionsBox && reactionsBox.children.length === 0){
    reactionsBox.remove();
  }
}

async function loadRoomMsg(roomId, isFirstLoad = false){
  let query = sb
    .from("messages")
    .select("*")
    .eq("room_id", roomId)
    .order("created_at",{asc:true})
    .limit(PAGE_SIZE);

  if(!isFirstLoad && roomOldestTime[roomId]){
    query = query.lt("created_at", roomOldestTime[roomId]);
  }

  const {data, error} = await query;
  if(error) return;

  const listEl = document.getElementById(`r-${roomId}`);

  if(isFirstLoad){
    listEl.innerHTML = "";
    if(data.length > 0) roomOldestTime[roomId] = data[0].created_at;
    data.forEach(m=>listEl.appendChild(createMsgElement(roomId, m, data)))
    listEl.scrollTop = listEl.scrollHeight;
  }else{
    if(data.length > 0) roomOldestTime[roomId] = data[0].created_at;
    const beforeHeight = listEl.scrollHeight;
    const fragment = document.createDocumentFragment();
    data.forEach(m=>fragment.appendChild(createMsgElement(roomId, m, data)))
    listEl.insertBefore(fragment, listEl.firstChild);
    listEl.scrollTop += listEl.scrollHeight - beforeHeight;
  }
}

function createMsgElement(roomId, m, allRows){
  const div = document.createElement("div");

  let isMe = false;
  if(m.sender_id && m.sender_id.trim() !== ""){
    isMe = m.sender_id === ADMIN_SENDER_ID;
  } else {
    isMe = m.is_admin;
  }
  div.className = "msg "+(isMe ? "admin" : "visitor");
  div.dataset.id = m.id;
  
  let inner = "";
  const nick = m.nickname || (isMe ? ADMIN_NICKNAME : "匿名使用者");
  inner += `<div class="msg-nick">${nick}</div>`;

  if(m.reply_to){
    const target = allRows ? allRows.find(x=>x.id === m.reply_to) : null;
    const quoteText = target ? target.content : "已刪除的訊息";
    const short = quoteText.length > 18 ? quoteText.slice(0,18)+"..." : quoteText;
    inner += `<div class="reply-quote">↩ ${short}</div>`;
  }
  
  inner += `<span>${m.content}<br><small>${formatTime(m.created_at)}</small>`;
  
  if(m.reactions && Object.keys(m.reactions).length > 0){
    inner += '<div class="msg-reactions">';
    Object.entries(m.reactions).forEach(([emoji, count])=>{
      inner += `<span class="reaction-item" data-emoji="${emoji}" data-count="${count}" onclick="addReaction('${roomId}', ${m.id}, '${emoji}')">${emoji} ${count}</span>`;
    })
    inner += '</div>';
  }
  inner += `</span>`;

  inner += '<span><div class="msg-reaction-bar">';
  QUICK_EMOJIS.forEach(e=>{
    inner += `<span onclick="addReaction('${roomId}', ${m.id}, '${e}')">${e}</span>`;
  })
  inner += '</div>';

  inner += `
    <button class="reply-btn" onclick="setRoomReply('${roomId}', ${m.id}, '${m.content.replace(/'/g,"\\'")}')">回覆</button>
    <button class="del-btn" onclick="delMsg('${roomId}', ${m.id})">刪除</button>
  </span>`;
  
  div.innerHTML = inner;
  return div;
}

async function loadMoreMsg(roomId){
  await loadRoomMsg(roomId, false);
}

function toggleRoom(roomId){
  const body = document.getElementById(`body-${roomId}`);
  const toggle = document.getElementById(`toggle-${roomId}`);
  if(body.style.display === "none"){
    body.style.display = "block";
    toggle.innerText = "−";
  }else{
    body.style.display = "none";
    toggle.innerText = "+";
  }
}

async function delMsg(roomId, id){
  const {error} = await sb.from("messages").delete().eq("id",id);
  if(error) {
    console.log("刪除錯誤：",error);
    return;
  }
  await loadRoomMsg(roomId, true);
}

async function sendAdminMsg(roomId){
  const txt = document.getElementById(`rep-${roomId}`).value.trim();
  if(!txt) return;
  
  const payload = {
    room_id:roomId,
    content:txt,
    is_admin:true,
    sender_id: ADMIN_SENDER_ID,
    nickname: ADMIN_NICKNAME
  };
  if(roomReply[roomId]) payload.reply_to = roomReply[roomId];
  
  const {error} = await sb.from("messages").insert([payload])
  if(error) console.log("送出錯誤：",error);
  
  document.getElementById(`rep-${roomId}`).value = "";
  cancelRoomReply(roomId);
  setTimeout(()=>loadRoomMsg(roomId, true), 300);
}

sb.channel("all")
  .on("postgres_changes",{event:"*",schema:"public",table:"messages"},(payload)=>{
    const newMsg = payload.new;
    if(payload.eventType === "INSERT"){
      showNotify("有新匿名訊息", `房間 ${newMsg.room_id} 收到新訊息`);
      const listEl = document.getElementById(`r-${newMsg.room_id}`);
      if(listEl){
        loadRoomMsg(newMsg.room_id, true);
      }else{
        loadAllRooms();
      }
    } else if(payload.eventType === "UPDATE"){
      // UPDATE 只局部更新表情，不重繪、不跳動
      updateReactionDomFull(newMsg.room_id, newMsg.id, newMsg.reactions);
    }
  })
  .subscribe()

// 用完整 reactions 更新單則訊息
function updateReactionDomFull(roomId, msgId, reactions){
  const listEl = document.getElementById(`r-${roomId}`);
  if(!listEl) return;
  const msgEl = listEl.querySelector(`.msg[data-id="${msgId}"]`);
  if(!msgEl) return;

  let reactionsBox = msgEl.querySelector(".msg-reactions");
  if(!reactionsBox){
    reactionsBox = document.createElement("div");
    reactionsBox.className = "msg-reactions";
    const textSpan = msgEl.querySelector("span");
    textSpan.appendChild(reactionsBox);
  }

  reactionsBox.innerHTML = "";
  if(reactions && Object.keys(reactions).length > 0){
    Object.entries(reactions).forEach(([emoji, count])=>{
      const span = document.createElement("span");
      span.className = "reaction-item";
      span.dataset.emoji = emoji;
      span.dataset.count = count;
      span.innerText = `${emoji} ${count}`;
      span.onclick = ()=>addReaction(roomId, msgId, emoji);
      reactionsBox.appendChild(span);
    })
  } else {
    reactionsBox.remove();
  }
}

loadAllRooms();
</script>
</body>
</html>
