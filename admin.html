<script>
// 一樣替換成你的 Supabase 資訊
const SUPABASE_URL = "https://lwbqcmvwqtlcgsccezxb.supabase.co";
const SUPABASE_KEY = "sb_publishable_jW632EqSBRq4hBCM4xdP4A_1ftKbvMM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadAllRooms(){
  const {data,error}=await sb
    .from("messages")
    .select("*")
    .order("created_at",{asc:true})
  if(error) {
    console.log("載入錯誤：", error);
    return;
  }
  // 依照 room_id 分組
  const groups = {};
  data.forEach(m=>{
    if(!groups[m.room_id]) groups[m.room_id]=[];
    groups[m.room_id].push(m);
  })
  const box = document.getElementById("container");
  box.innerHTML = "";
  Object.keys(groups).forEach(roomId=>{
    const roomDiv = document.createElement("div");
    roomDiv.className="room";
    roomDiv.innerHTML = `<div class="room-id">房間ID：${roomId}</div><div class="msg-list" id="r-${roomId}"></div>
    <div class="reply-area">
      <textarea id="rep-${roomId}" placeholder="回覆訊息..."></textarea>
      <button onclick="sendAdminMsg('${roomId}')">送出回覆</button>
    </div>`
    box.appendChild(roomDiv);
    renderRoomMsg(roomId, groups[roomId]);
  })
}

function renderRoomMsg(roomId, list){
  const el = document.getElementById(`r-${roomId}`);
  el.innerHTML = "";
  list.forEach(m=>{
    const div = document.createElement("div");
    div.className = "msg "+(m.is_admin?"admin":"visitor");
    div.innerHTML = `<span>${m.content}<br><small>${m.created_at}</small></span>
    <button class="del-btn" onclick="delMsg(${m.id})">刪除</button>`
    el.appendChild(div);
  })
}

async function delMsg(id){
  const {error} = await sb.from("messages").delete().eq("id",id);
  if(error) {
    console.log("刪除錯誤：",error);
    return;
  }
  // ✅ 刪除成功立刻重載，不用等 realtime
  loadAllRooms();
}

async function sendAdminMsg(roomId){
  const txt = document.getElementById(`rep-${roomId}`).value.trim();
  if(!txt) return;
  const {error} = await sb.from("messages").insert([{room_id:roomId, content:txt, is_admin:true}])
  if(error) console.log("送出錯誤：",error);
  document.getElementById(`rep-${roomId}`).value="";
  loadAllRooms();
}

// 即時監聽
sb.channel("all")
  .on("postgres_changes",{event:"*",schema:"public",table:"messages"},()=>loadAllRooms())
  .subscribe()

loadAllRooms();
</script>
